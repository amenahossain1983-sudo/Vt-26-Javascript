<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official</title>
    <h1 id="greetings"></h1>
</head>

<body>
    <button id="btnHyr"> Hyr elcooter </button>
    <p id="meddelande"></p>
    <button id="perMinut"> 1 minut </button>
    <button id="trettioMinut"> 30 minuter </button>
    <button id="1Timme"> 60 minuter </button>
    <p id="statusText"> Status: Ledig</p>
    <p id="historik"> </p>
    <button id="avsluta"> Avsluta </button>
    <script>
        const params = new URLSearchParams(window.location.search);
        const text = document.getElementById('greetings');
        let username = params.get('username');
        const endBtn = document.getElementById('avsluta');
        const perMinut = document.getElementById('perMinut');
        const trettioMinut = document.getElementById('trettioMinut');
        const sextioMin = document.getElementById('1Timme');
        const meddelande = document.getElementById('meddelande');

        let pris = 0;

        perMinut.addEventListener('click', function () { // 
            if (isHyrd) {
                pris += 1;
                historik.textContent = "Pris: " + pris + "kr";
            } });

            trettioMinut.addEventListener('click', function () {
                if (isHyrd) {
                    pris += 30;
                    historik.textContent = "Pris: " + pris + "kr";
                }
                  });
                
                  sextioMin.addEventListener('click', function () {
                    if (isHyrd) {
                        pris += 60;
                        historik.textContent = "Pris: " + pris + "kr";
                    }
                      });
            
          
      

        if (username) {
            text.textContent = `Välkommen, ${username} !`;

        }

        const btnHyr = document.getElementById('btnHyr'); //Här så hämtar vi knappen "bntHyr" därmed statusen av knappet när använder trycker på det    
        const statusText = document.getElementById('statusText');
        const historik = document.getElementById('historik');

        // Här så gör vi så att elementen syns

        btnHyr.style.display = "block";
        statusText.style.display = "block";
        historik.style.display = "block";

        let isHyrd = false;  // Visar att det inte än finns något uthyrd elsparre - Dvs, att det inte finns
        let startTid = 0; // Troligen sp behöver vi en variabel som behöver för att spara starttiden
        btnHyr.textContent = 'Hyr elscooter';
        btnHyr.addEventListener('click', function () { // Funktionen till när man trycker, vad som händer alltså

            if (!isHyrd) { // Om den inte är hyrd
                isHyrd = true;
                statusText.textContent = "Status: Uthyrd";
                btnHyr.textContent = "Lämna tillbaka";

                // Detta sparar tiden när man ska börja hyra
                startTid = Date.now();

            meddelande.textContent = "Välj hur länge du vill hyra: 1 minut, 30 minuter eller 60 minuter";
            // Basic css förändring
            document.body.style.backgroundColor="lightgreen";

        
            }
            else {
                isHyrd = false;
                statusText.textContent = "Status:Ledig";
                btnHyr.textContent = "Hyr elscooter";

                let slutTid = Date.now();
                let minuter = Math.floor((slutTid - startTid) / 60000);

                historik.textContent += " Du hyrde i " + minuter + " minuter " ;

                historik.textContent += "Total pris: " + pris + " kr";
                pris = 0;

                document.body.style.backgroundColor="white";
                
            }
          
            


            // Alternativ sätt att ändra css för : statusText.style.color="green";
              

        }
        );
        endBtn.addEventListener('click', function() {
            historik.textContent ="";
            meddelande.textContent="";

            statusText.textContent="Status: Ledig";
            btnHyr.textContent ="Hyr elscooter";

            pris = 0;
            isHyrd = false;

            document.body.style.backgroundColor="white";

        })
    
        

    </script>
</body>

</html>
